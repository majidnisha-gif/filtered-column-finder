name: Build and publish Excel add-in

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install packages
        run: npm ci
      - name: Set the permanent add-in address
        run: echo "ADDIN_BASE_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"
      - name: Build the add-in for hosting
        run: npm run build
      - name: Prepare the published files
        run: touch dist/.nojekyll
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the add-in files
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish the add-in files
        id: deployment
        uses: actions/deploy-pages@v4
