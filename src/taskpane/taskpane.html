<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Filtered Column Finder</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="taskpane.css" />
</head>
<body>
  <main class="panel">
    <div class="eyebrow">EXCEL TOOL</div>
    <h1>Filtered Column Finder</h1>
    <p>Jump to the rightmost column with an active filter on this sheet.</p>
    <button id="find-button" type="button">Go to last filtered column</button>
    <div id="status" role="status" aria-live="polite">Ready when you are.</div>
    <p class="note">Works with worksheet filters and table filters.</p>
  </main>
</body>
</html>
